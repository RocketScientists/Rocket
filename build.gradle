// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Keep this block for old and annoying firebase plugins that don't support the new plugin DSL yet.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.firebase:perf-plugin:1.4.2'  // Performance Monitoring plugin
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.8.0'
    }
}

plugins {
    id "com.android.application" version "8.0.2" apply false
    id "com.android.library" version "8.0.2" apply false
    id "org.jetbrains.kotlin.android" version "1.7.20" apply false
    id "androidx.navigation.safeargs" version "2.5.3" apply false
    id "com.google.android.gms.oss-licenses-plugin" version "0.10.9" apply false
    id 'com.google.devtools.ksp' version '1.7.20-1.0.6' apply false
}

apply from: 'buildSrc/ktlint.gradle'

task clean(type: Delete) {
    delete rootProject.buildDir
}
