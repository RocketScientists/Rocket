apply plugin: 'kotlin'
apply plugin: 'com.google.devtools.ksp'
apply from: "$rootProject.projectDir/buildSrc/compile-kotlin.gradle"
apply from: "$rootProject.projectDir/buildSrc/compile-java.gradle"

dependencies {
    implementation project(path: ':telemetry-annotation')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${Versions.kotlin}"

    implementation "com.google.auto.service:auto-service-annotations:1.0-rc6"
    ksp "com.google.auto.service:auto-service:1.0-rc6"

    testImplementation "junit:junit:${Versions.junit4}"
    testImplementation 'com.google.testing.compile:compile-testing:0.15'
}
