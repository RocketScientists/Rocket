apply from: "$rootProject.projectDir/buildSrc/android-library-base.gradle"
apply from: '../../../buildSrc/pmd.gradle'
apply from: '../../../buildSrc/checkstyle.gradle'

android {
    namespace 'org.mozilla.httptask'
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation libs.androidx.appcompat
    implementation project(path: ':HttpRequest')
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.mockwebserver
}

afterEvaluate {
    check.dependsOn 'pmd', 'checkstyle'
}
