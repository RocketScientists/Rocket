androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "test-runner" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version = "2.2.0" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-espresso-contrib = { group = "androidx.test.espresso", name = "espresso-contrib", version.ref = "espresso" }
androidx-test-espresso-idling-resource = { group = "androidx.test.espresso", name = "espresso-idling-resource", version.ref = "espresso" }
androidx-test-espresso-intents = { group = "androidx.test.espresso", name = "espresso-intents", version.ref = "espresso" }
androidx-test-espresso-web = { group = "androidx.test.espresso", name = "espresso-web", version.ref = "espresso" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
falcon = { group = "com.jraska", name = "falcon", version = "2.2.0" }
screengrab = { group = "tools.fastlane", name = "screengrab", version = "2.1.0" }
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version = "2.7" }

[bundles]
mozilla-components = [
    "mozilla-components-browser-session",
    "mozilla-components-browser-domains",
    "mozilla-components-ui-autocomplete",
    "mozilla-components-lib-fetch-httpurlconnection",
    "mozilla-components-concept-fetch",
    "mozilla-components-concept-engine",
    "mozilla-components-browser-engine-system",
    "mozilla-components-concept-awesomebar",
    "mozilla-components-browser-awesomebar"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version = "2.5.3" }
oss-licenses = { id = "com.google.android.gms.oss-licenses-plugin", version = "0.10.9" }
