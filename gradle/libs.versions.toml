[versions]
minSdk = "21"
targetSdk = "31"
compileSdk = "31"
versionCode = "1"
versionName = "2.10.1"
android-gradle-plugin = "8.0.2"
support = "1.0.0"
cardview = "1.0.0"
arch-work = "2.7.0"
room = "2.4.3"
glide = "4.16.0"
kotlin = "1.7.20"
ksp = "1.7.20-1.0.8"
kotlinx-coroutine = "1.6.0"
ktlint = "0.41.0"
mozilla-android-components = "0.52.0"
android-components-awesomebar = "0.56.0"
android-x-appcompat = "1.3.1"
android-x-lifecycle = "2.5.1"
