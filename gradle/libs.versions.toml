mozilla-components-browser-awesomebar = { group = "org.mozilla.components", name = "browser-awesomebar", version.ref = "android-components-awesomebar" }

# Google Libraries
google-android-material = { group = "com.google.android.material", name = "material", version = "1.5.0" }
google-playCore = { group = "com.google.android.play", name = "core", version = "1.10.2" }
google-dagger = { group = "com.google.dagger", name = "dagger", version.ref = "dagger" }
google-dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "dagger" }
